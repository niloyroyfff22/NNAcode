name: Build Android

on: 
  workflow_dispatch:
  push:
    branches:
      - personal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Java 17 (IMPORTANT)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      # 4. Android SDK (sdkmanager এখানে আসবে)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 5. Install SDK packages (Correct way)
      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      # 6. Global tools
      - run: npm install -g cordova yarn

      # 7. Install deps
      - run: yarn install --frozen-lockfile

      # 8. Build
      - name: Build APK
        run: |
          cordova platform add android || true
          cordova build android --debug

      # 9. Upload
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"